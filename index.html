<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class = 'header'>
        <button type = 'button' id = 'start_button' class = 'btn btn_start'> <span>&#9654;</span>Начать</button>
        <button type = 'button' id = 'stop_button' class = 'btn btn_stop'>Закончить</button>
        <button type = 'button' id = 'clear_button', class = 'btn btn_clear'>🗑 Очистить</button>
    </header>
    
    <div class="app-container" style="display: flex;">
        <div>
            <div id = 'sidebar'>
                <ul class = 'block_list'>
                    <li class = 'block-item start-block'>Начало программы</li>
                    <li class = 'block-item end-block'>Конец программы</li>
                    <li class = 'block-item equals-block'></li>
                    <li class = 'block-item plus-block'></li>
                    <li class = 'block-item assign-block'></li>
                    <li class = 'block-item if-block'></li>
                    <li class = 'block-item for-block'></li>
                    <li class = 'block-item while-block'></li>
                    <li class = 'block-item declare-block'></li>
                    <li class = 'block-item print-block'></li>
                </ul>
                <button type = 'button' id = 'add_vars' class = 'btn'> Добавить переменные</button>
                <ul class = 'var_list'>

                </ul>
                <button type = 'button' id = 'add_arr' class = 'btn'> Добавить массив</button>
                <ul class = 'arr_list'>
                    
                </ul>
            </div>
        </div>
    
        <div class = 'drop-zone' style="flex: 1; margin-left: 10px;">

        </div>
        <aside class="right-sidebar">
            <div class="sidebar-section">
                <p class="col-title">
                    Переменные:
                </p>
                <div id="vars-display">
                    <p class="empty-text">
                        Переменных нет
                    </p>
                </div>
            </div>
            <div class="sidebar-section">
                <p class="col-title">
                    Вывод:
                </p>
                <div id="output">
                    <p class="empty-text">
                        ...
                    </p>
                </div>
            </div>

            <div class="sidebar-section error-section">
                <p class="col-title">
                    Ошибки:
                </p>
                <div id="output">
                    <p class="empty-text">
                        Ошибок нет
                    </p>
                </div>
            </div>
        </aside>
    </div>
    <script src = 'main.js'></script>
</body>
</html>
